apiVersion: v1
kind: Config
current-context: prod
clusters:
  - name: arn:aws:eks:ap-northeast-2:123456789012:cluster/prod
    cluster:
      server: https://ABCDEF.gr7.ap-northeast-2.eks.amazonaws.com
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
contexts:
  - name: prod
    context:
      cluster: arn:aws:eks:ap-northeast-2:123456789012:cluster/prod
      user: arn:aws:eks:ap-northeast-2:123456789012:cluster/prod
users:
  - name: arn:aws:eks:ap-northeast-2:123456789012:cluster/prod
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: /opt/add-eks/helper
        args:
          - --cluster
          - prod
          - --region
          - ap-northeast-2
          - --cache-dir
          - /tmp/add-eks-cache
          - --safety-margin
          - "90"
          - --cache-key
          - prod-key
        interactiveMode: Never
